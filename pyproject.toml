[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "aether-platform"
version = "0.1.0"
description = "Personal AI automation platform backend packages"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Aether Engineering" }]
dependencies = [
    "argon2-cffi>=23.1,<24",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<0.29",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "PyJWT[crypto]>=2.10,<3",
    "SQLAlchemy>=2.0.36,<3",
    "asyncpg>=0.30,<1",
    "celery>=5.4,<6",
    "redis>=5.2,<6",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.14,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.25,<1",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/aether"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend/src", "backend/tests", "services"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**" = ["S101"]
"backend/src/aether/auth/oauth.py" = ["S105"]
"backend/src/aether/infrastructure/persistence/memory_repository.py" = ["E501"]
"backend/src/aether/automation/action_service.py" = ["E501"]
"backend/src/aether/automation/outbox.py" = ["E501"]
"backend/src/aether/infrastructure/persistence/automation_repository.py" = ["E501"]
"backend/src/aether/interfaces/http/automation.py" = ["E501"]
"backend/src/aether/infrastructure/persistence/workflow_repository.py" = ["E501"]
"backend/src/aether/interfaces/http/workflows.py" = ["E501"]
"backend/src/aether/infrastructure/persistence/browser_repository.py" = ["E501"]
"backend/src/aether/interfaces/http/browser.py" = ["E501"]
"backend/src/aether/infrastructure/persistence/desktop_repository.py" = ["E501"]
"backend/src/aether/interfaces/http/desktop.py" = ["E501"]
"backend/src/aether/desktop/service.py" = ["E501"]
"backend/src/aether/infrastructure/persistence/voice_repository.py" = ["E501"]
"backend/src/aether/interfaces/http/voice.py" = ["E501"]
"backend/src/aether/voice/service.py" = ["E501"]
"services/desktop-executor/src/executor.py" = ["S603", "S607"]
"services/desktop-executor/src/server.py" = ["S310", "S104"]
"services/voice-executor/src/voice_engine.py" = ["S603", "S607"]
"services/voice-executor/src/voice_server.py" = ["S310", "S104"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["backend/src", "backend/tests", "services"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["aether"]
