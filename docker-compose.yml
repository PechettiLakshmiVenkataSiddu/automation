services:
  db:
    image: postgres:16-alpine
    container_name: aether-db
    restart: always
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aether"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-init:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aether-db-init
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/aether
    command: python -m aether.bootstrap.migrate

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aether-api
    restart: always
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/aether
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: supersecretjwttokenkey123
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aether-worker
    restart: always
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/aether
      REDIS_URL: redis://redis:6379/0
    command: celery -A aether.automation.queue worker --loglevel=info

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aether-scheduler
    restart: always
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:password123@db:5432/aether
      REDIS_URL: redis://redis:6379/0
    command: celery -A aether.automation.queue beat --loglevel=info

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aether-web
    restart: always
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    ports:
      - "3000:3000"

  chroma:
    image: chromadb/chroma:latest
    container_name: aether-chroma
    restart: always
    ports:
      - "8001:8000"
    volumes:
      - chromadata:/chroma/data

  storage:
    image: minio/minio:latest
    container_name: aether-storage
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"

  nginx:
    image: nginx:alpine
    container_name: aether-nginx
    restart: always
    depends_on:
      - api
      - web
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  pgdata:
  chromadata:
  miniodata:
