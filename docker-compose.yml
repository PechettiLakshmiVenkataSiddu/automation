services:
  db:
    image: postgres:16-alpine
    container_name: aether-db
    restart: always
    environment:
      POSTGRES_DB: aether
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: aether-redis
    restart: always
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aether-api
    restart: always
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password123@db:5432/aether
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: supersecretjwttokenkey123
    ports:
      - "8000:8000"

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aether-worker
    restart: always
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password123@db:5432/aether
      REDIS_URL: redis://redis:6379/0
    command: celery -A aether.automation.queue worker --loglevel=info

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aether-scheduler
    restart: always
    depends_on:
      - db
      - redis
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:password123@db:5432/aether
      REDIS_URL: redis://redis:6379/0
    command: celery -A aether.automation.queue beat --loglevel=info

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: aether-web
    restart: always
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
