name: Validation and Build Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, Type Check, and Test Codebase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@f67e240f2d77029fc427d11966c6b40384c2208f # v5.3.0
        with:
          python-version: "3.12"

      - name: Install UV Package Manager
        uses: astral-sh/setup-uv@8c40d5dc6b5a34714d45543cf71a9de4c28f7311 # v5.1.0
        with:
          enable-cache: true

      - name: Install Dependencies
        run: |
          uv sync --group dev
          uv pip install pytest-cov

      - name: Run Ruff Linter
        run: uv run ruff check backend/src backend/tests services

      - name: Run MyPy Type Checker
        run: uv run mypy

      - name: Run PyTest Suite with Coverage
        run: |
          export PYTHONPATH=backend/src
          uv run pytest --cov=backend/src/aether --cov-report=xml

      - name: Set up Node.js 20
        uses: actions/setup-node@0a44ba7841725637a19e28fa30b79a866c81b0a6 # v4.2.0
        with:
          node-version: "20"

      - name: Install Pnpm Corepack
        run: |
          corepack enable
          corepack prepare pnpm@9.15.4 --activate

      - name: Install Frontend Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Next.js Type Check
        run: pnpm --filter web typecheck

  docker-verify:
    name: Verify Docker Compose Configuration
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate Docker Compose Config
        run: docker compose config
